services:
  api:
    build: ./backend
    container_name: site-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TORRENT_SOURCE: ${TORRENT_SOURCE:-apibay}
      APIBAY_URL: ${APIBAY_URL:-https://apibay.org}
      TORZNAB_URL: ${TORZNAB_URL:-}
      TORZNAB_API_KEY: ${TORZNAB_API_KEY:-}

  caddy:
    image: caddy:2-alpine
    container_name: site-caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
