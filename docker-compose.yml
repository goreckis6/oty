services:
  caddy:
    image: caddy:2-alpine
    container_name: site-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
