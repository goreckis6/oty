services:
  ytdown:
    build: .
    image: ytdown:local
    container_name: ytdown
    restart: unless-stopped
    ports:
      - "${YTDOWN_PUBLIC_PORT:-3000}:8080"
    environment:
      WORKER_ID: ${WORKER_ID:-w1}
      YTDOWN_DOWNLOADS_DIR: /downloads
      YTDOWN_HOST: "0.0.0.0"
      YTDOWN_PORT: "8080"
      # YTDOWN_COOKIES_BROWSER: chrome
    volumes:
      - ./downloads:/downloads
