services:
  api:
    build: ./backend
    container_name: site-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/data:/app/data
      - ./public:/app/public:ro
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-sqlite}
      DB_PATH: /app/data/movies.db
      PUBLIC_DIR: /app/public
      SITE_URL: ${SITE_URL:-http://localhost}
      SITE_NAME: ${SITE_NAME:-YTS}
      SITE_TAGLINE: ${SITE_TAGLINE:-HD movies at the smallest file size}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TORRENT_SOURCE: ${TORRENT_SOURCE:-apibay}
      YTS_SCRAPE_URL: ${YTS_SCRAPE_URL:-https://yts.bz/api/v2}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}

  caddy:
    image: caddy:2-alpine
    container_name: site-caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
