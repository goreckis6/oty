services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_IMAGE_TAG:-1.3.1-deno}
    container_name: ytdown-bgutil
    restart: unless-stopped
    init: true
    expose:
      - "4416"

  ytdown:
    build: .
    image: ytdown:local
    container_name: ytdown
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WORKER_ID: ${WORKER_ID:-w1}
      YTDOWN_DOWNLOADS_DIR: /downloads
      YTDOWN_HOST: "0.0.0.0"
      YTDOWN_PORT: "8080"
      YTDOWN_YOUTUBE_CLIENTS: ${YTDOWN_YOUTUBE_CLIENTS:-}
      YTDOWN_JS_RUNTIMES: ${YTDOWN_JS_RUNTIMES:-deno,node}
      YTDOWN_REMOTE_COMPONENTS: ${YTDOWN_REMOTE_COMPONENTS:-ejs:github,ejs:npm}
      YTDOWN_SLEEP_INTERVAL_REQUESTS: ${YTDOWN_SLEEP_INTERVAL_REQUESTS:-1}
      YTDOWN_POT_PROVIDER_URL: ${YTDOWN_POT_PROVIDER_URL:-http://bgutil-provider:4416}
      YTDOWN_PROXY: ${YTDOWN_PROXY:-}
      # YTDOWN_COOKIES_FILE: /etc/ytdown/cookies.txt
      # YTDOWN_COOKIES_BROWSER: chrome  # tylko lokalnie, nie w Dockerze
    volumes:
      - ./downloads:/downloads
      # cookies — wgraj plik na serwer, potem odkomentuj:
      # - ./secrets/cookies.txt:/app/secrets/cookies.txt:ro
    depends_on:
      - bgutil-provider

  caddy:
    image: caddy:2-alpine
    container_name: ytdown-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-yts.cool}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile.runtime:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ytdown

volumes:
  caddy_data:
  caddy_config:
