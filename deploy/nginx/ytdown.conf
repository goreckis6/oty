# Routing po prefiksie job ID (w1-abc, w2-abc…).
# Dziś: jeden worker na localhost. Przy rozbudowie odkomentuj w2/w3 i podmień IP.

map $request_uri $job_worker {
    ~/(?:status|file)/w1-  127.0.0.1:8082;
    # ~/(?:status|file)/w2-  10.0.0.2:8082;
    # ~/(?:status|file)/w3-  10.0.0.3:8082;
    default                "";
}

upstream ytdown_pool {
    server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;
    # server 10.0.0.2:8082 max_fails=2 fail_timeout=10s;
    # server 10.0.0.3:8082 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # status / file → konkretny worker (plik leży na jego dysku)
    location ~ ^/api/download/(status|file)/ {
        if ($job_worker = "") { return 404; }
        proxy_pass http://$job_worker;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # start, analyze i reszta → round-robin
    location / {
        proxy_pass http://ytdown_pool;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
