# nginx na maszynie LOAD BALANCER (nie na workerze).
# Podmień WORKER_IP na IP z terraform output worker_ips.

map $request_uri $job_worker {
    ~/(?:status|file)/w1-  WORKER_IP:8082;
    default                "";
}

upstream ytdown_pool {
    server WORKER_IP:8082 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location ~ ^/api/download/(status|file)/ {
        if ($job_worker = "") { return 404; }
        proxy_pass http://$job_worker;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://ytdown_pool;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
