name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ytdown' }}
      DOMAIN: ${{ secrets.DOMAIN || '' }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL || '' }}
      DATA_SOURCE: ${{ secrets.DATA_SOURCE || 'sqlite' }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || '' }}
      TORRENT_SOURCE: ${{ secrets.TORRENT_SOURCE || 'apibay' }}
      ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
      SITE_NAME: ${{ secrets.SITE_NAME || 'YTS' }}
      SITE_TAGLINE: ${{ secrets.SITE_TAGLINE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate secrets
        run: |
          test -n "$DEPLOY_USER" || (echo "Missing DEPLOY_USER" && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "Missing DEPLOY_SSH_KEY" && exit 1)
          test -n "$DEPLOY_HOST" || (echo "Missing DEPLOY_HOST" && exit 1)

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to server
        run: |
          # NEVER delete backend/data/movies.db — scraped movies live only on VPS.
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'node_modules' \
            --exclude 'secrets' \
            --exclude '.env' \
            --include 'backend/data/test_movies.json' \
            --exclude 'backend/data/*' \
            --include 'public/index.html' \
            --exclude 'public/*.html' \
            --exclude 'public/*.htm' \
            --exclude 'public/*.xml' \
            --exclude 'public/*.txt' \
            --exclude 'public/*.json' \
            --include 'public/uploads/.gitkeep' \
            --exclude 'public/uploads/*' \
            --include 'public/downloads/.gitkeep' \
            --exclude 'public/downloads/*' \
            --exclude 'public/.well-known/***' \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Verify database not removed by rsync
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "if [ -f '${DEPLOY_PATH}/backend/data/movies.db' ]; then
               echo \"movies.db OK: \$(du -h '${DEPLOY_PATH}/backend/data/movies.db' | awk '{print \$1}')\"
             else
               echo 'movies.db not present yet (first deploy / empty DB)'
             fi"

      - name: Remote deploy
        timeout-minutes: 10
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o ServerAliveInterval=30 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x ${DEPLOY_PATH}/deploy/scripts/*.sh && \
             APP_DIR='${DEPLOY_PATH}' DOMAIN='${DOMAIN}' ACME_EMAIL='${ACME_EMAIL}' \
             DATA_SOURCE='${DATA_SOURCE}' TMDB_API_KEY='${TMDB_API_KEY}' TORRENT_SOURCE='${TORRENT_SOURCE}' \
             ADMIN_USER='${ADMIN_USER}' ADMIN_PASSWORD='${ADMIN_PASSWORD}' JWT_SECRET='${JWT_SECRET}' \
             SITE_NAME='${SITE_NAME}' SITE_TAGLINE='${SITE_TAGLINE}' \
             bash '${DEPLOY_PATH}/deploy/scripts/deploy.sh'"

      - name: Health check
        if: env.DOMAIN != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          DOMAIN_CLEAN=$(echo "$DOMAIN" | tr -d '\n\r' | sed 's|https\?://||' | sed 's|/$||')
          echo "Checking https://${DOMAIN_CLEAN} (via ${DEPLOY_HOST}:443)..."
          sleep 15

          check_api() {
            body=$(curl -4 -sfL --max-time 20 --resolve "${DOMAIN_CLEAN}:443:${DEPLOY_HOST}" "https://${DOMAIN_CLEAN}/api/v1/health" 2>/dev/null || true)
            echo "$body" | grep -q '"status"'
          }

          check_movies_api() {
            body=$(curl -4 -sfL --max-time 20 --resolve "${DOMAIN_CLEAN}:443:${DEPLOY_HOST}" "https://${DOMAIN_CLEAN}/api/v1/list_movies.json?limit=1" 2>/dev/null || true)
            echo "$body" | grep -q '"movie_count"'
          }

          check_frontend() {
            body=$(curl -4 -sfL --max-time 20 --resolve "${DOMAIN_CLEAN}:443:${DEPLOY_HOST}" "https://${DOMAIN_CLEAN}/" 2>/dev/null || true)
            case "$body" in *'<!DOCTYPE html'*) return 0 ;; *) return 1 ;; esac
          }

          for i in $(seq 1 18); do
            if check_frontend; then
              echo "==> Frontend OK"
              for j in $(seq 1 12); do
                if check_api && check_movies_api; then
                  echo ""
                  echo "==> API OK"
                  echo "==> Deploy OK: https://${DOMAIN_CLEAN}"
                  exit 0
                fi
                echo "API health attempt ${j}/12 failed, retry in 5s..."
                sleep 5
              done
              echo "API health failed after frontend was ready"
              curl -4 -svk --max-time 20 --resolve "${DOMAIN_CLEAN}:443:${DEPLOY_HOST}" "https://${DOMAIN_CLEAN}/api/v1/health" 2>&1 | tail -30 || true
              exit 1
            fi
            body=$(curl -4 -sfL --max-time 20 "https://${DOMAIN_CLEAN}/" 2>/dev/null || true)
            case "$body" in *'<!DOCTYPE html'*) frontend_ok=1 ;; *) frontend_ok=0 ;; esac
            if [ "$frontend_ok" -eq 1 ]; then
              echo "==> Frontend OK (direct DNS)"
              for j in $(seq 1 12); do
                if check_api && check_movies_api; then
                  echo ""
                  echo "==> API OK"
                  echo "==> Deploy OK (direct DNS): https://${DOMAIN_CLEAN}"
                  exit 0
                fi
                echo "API health attempt ${j}/12 failed, retry in 5s..."
                sleep 5
              done
              exit 1
            fi
            echo "attempt ${i}/18 failed, retry in 10s..."
            sleep 10
          done
          echo "Health check failed for https://${DOMAIN_CLEAN}/"
          curl -4 -svk --max-time 20 --resolve "${DOMAIN_CLEAN}:443:${DEPLOY_HOST}" "https://${DOMAIN_CLEAN}/" 2>&1 | tail -20 || true
          exit 1
