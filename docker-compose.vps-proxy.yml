# VPS: tylko Caddy (HTTPS) → backend na domowym PC przez tunel SSH.
# Caddy używa network_mode: host, żeby widzieć 127.0.0.1:PORT tunelu na VPS.
# Wygeneruj Caddyfile: deploy/scripts/setup-vps-home-proxy.sh
services:
  caddy:
    image: caddy:2-alpine
    container_name: ytdown-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:-yts.cool}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile.runtime:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
